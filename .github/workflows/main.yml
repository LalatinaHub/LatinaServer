name: CI and Release

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master

jobs:
  test:
    name: Test & Coverage
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Verify dependencies
        run: |
          go mod download
          go mod verify

      - name: Run unit tests with coverage
        run: |
          go test -v -race -coverprofile="coverage.out" -covermode="atomic" ./...

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.out

  lint:
    name: Lint & Code Quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Run go vet
        run: go vet ./...

  build-and-release:
    name: Build and Release
    needs: [test, lint]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set .netrc
        if: env.HAS_NETRC == 'true'
        env:
          HAS_NETRC: ${{ secrets.NETRC != '' }}
        run: echo "${{ secrets.NETRC }}" | base64 --decode > ~/.netrc

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: "go.mod"
          cache: true

      - name: Build binary
        run: |
          go build -v -tags with_grpc,with_clash_api,with_v2ray_api,with_utls,with_gvisor,with_quic -o latinaserver cmd/latinaserver/main.go
          tar -czvf latinaserver.tar.gz latinaserver

      - name: Create GitHub Release
        uses: ncipollo/release-action@v1.14.0
        with:
          artifacts: "latinaserver.tar.gz"
          allowUpdates: true
          tag: ${{ github.ref_name }}

