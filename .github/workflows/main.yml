name: Build and Create Release

on:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Set up Go
      uses: actions/setup-go@v4
      with:
        go-version: '1.20'

    - name: Build
      run: |
        go build -tags with_grpc,with_clash_api,with_v2ray_api,with_utls,with_reality_server,with_gvisor,with_quic -o latinaserver cmd/latinaserver/main.go
        tar -czvf latinaserver.tar.gz latinaserver
    - name: Create Release
      uses: ncipollo/release-action@v1.14.0
      with:
        artifacts: "latinaserver.tar.gz"
            
